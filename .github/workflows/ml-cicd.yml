name: Iris ML CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Code tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check app.py train.py tests
      - run: pytest -q

  model-validation:
    name: Train and validate model
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Train model
        run: python train.py --model-path model.pkl
      - name: Validate accuracy and artifact
        run: |
          python - <<'PY'
          import json
          import pickle
          from pathlib import Path
          metrics = json.loads(Path("metrics.json").read_text())
          assert metrics["accuracy"] >= 0.90, f"Accuracy below 0.90: {metrics['accuracy']:.3f}"
          with Path("model.pkl").open("rb") as artifact:
              model = pickle.load(artifact)
          assert model.predict([[5.1, 3.5, 1.4, 0.2]]).shape == (1,)
          print(f"Model validation passed: accuracy={metrics['accuracy']:.3f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iris-model
          path: |
            model.pkl
            metrics.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Build and publish container
    runs-on: ubuntu-latest
    needs: model-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iris-model
          path: .
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
